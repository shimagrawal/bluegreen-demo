version: '3'

dotenv:
  - .env

vars:
  SUBST: '${GITOPS_REPO_URL} ${GITHUB_USERNAME} ${GITHUB_PAT} ${ARGOCD_DESTINATION}'

tasks:

  check:
    desc: Check required environment variables
    cmds:
      - |
        set -e

        for var in \
          AKUITY_ARGOCD_INSTANCE \
          AKUITY_KARGO_INSTANCE \
          AKUITY_ORG_NAME \
          GITOPS_REPO_URL \
          GITHUB_USERNAME \
          GITHUB_PAT \
          ARGOCD_DESTINATION
        do
          if [ -z "$(printenv "$var")" ]; then
            echo "ERROR: $var is not set"
            exit 1
          fi
        done

        echo "✓ All required variables are set"

  apply-kargo:
    desc: Apply Kargo Project, Git credentials, Warehouse and Stages
    deps:
      - check
    cmds:
      - |
        set -euo pipefail

        for f in kargo/project.yaml secret.yaml kargo/warehouse.yaml kargo/stages.yaml; do
          envsubst '{{.SUBST}}' < "$f" | \
            akuity kargo apply \
              -f - \
              --name "$AKUITY_KARGO_INSTANCE" \
              --org-name="$AKUITY_ORG_NAME"
        done

  apply-argocd:
    desc: Apply the Argo CD ApplicationSet
    deps:
      - check
    cmds:
      - |
        set -euo pipefail

        envsubst '{{.SUBST}}' < argocd/applicationset.yaml | \
          akuity argocd apply \
            -f - \
            --name "$AKUITY_ARGOCD_INSTANCE" \
            --org-name="$AKUITY_ORG_NAME"

  setup:
    desc: Set up the blue-green demo
    cmds:
      - task: check
      - task: apply-argocd
      - task: apply-kargo

  port-forward-live:
    desc: Port-forward the live Service to localhost:8080
    cmds:
      - kubectl port-forward svc/nginx 8080:80 -n bluegreen

  port-forward-preview:
    desc: Port-forward the preview Service to localhost:8081
    cmds:
      - kubectl port-forward svc/nginx-preview 8081:80 -n bluegreen

  port-forward-blue:
    desc: Port-forward the blue Service to localhost:8082
    cmds:
      - kubectl port-forward svc/nginx-blue 8082:80 -n bluegreen

  port-forward-green:
    desc: Port-forward the green Service to localhost:8083
    cmds:
      - kubectl port-forward svc/nginx-green 8083:80 -n bluegreen

  status:
    desc: Show which color is live and which is in preview, with versions
    silent: true
    cmds:
      - |
        for row in "LIVE nginx" "PREVIEW nginx-preview"; do
          set -- $row
          c=$(kubectl get svc "$2" -n bluegreen -o jsonpath='{.spec.selector.color}')
          v=$(kubectl get deploy "nginx-$c" -n bluegreen -o jsonpath='{.spec.template.spec.containers[0].image}' | cut -d: -f2)
          printf "%-8s %-14s → %-6s %s\n" "$1" "$2" "$c" "$v"
        done

  watch-status:
    desc: Refresh task status every 2 seconds
    cmds:
      - while true; do clear; task status; sleep 2; done

  cleanup:
    desc: Delete the Kargo Project, Argo CD ApplicationSet and the rendered stage branches
    cmds:
      - kargo delete project bluegreen-demo
      - argocd appset delete bluegreen --yes
      - git push origin --delete stage/preview stage/live
