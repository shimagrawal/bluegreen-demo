apiVersion: v1
data:
  default.conf: |
    server {
        listen 80;

        location / {
            root  /usr/share/nginx/html;
            index index.html;

            # Lets index.html print nginx's version and the pod name
            ssi on;

            # Always fetch the current page, so a switch shows up on a normal refresh
            add_header Cache-Control "no-store";
        }
    }
kind: ConfigMap
metadata:
  labels:
    color: green
  name: nginx-conf-green-t7987d6f75
