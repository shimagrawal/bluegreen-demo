apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    color: blue
  name: nginx-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
      color: blue
  template:
    metadata:
      labels:
        app: nginx
        color: blue
    spec:
      containers:
      - image: public.ecr.aws/nginx/nginx:1.31.2
        name: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html/index.html
          name: page
          subPath: index.html
        - mountPath: /etc/nginx/conf.d/default.conf
          name: conf
          subPath: default.conf
      volumes:
      - configMap:
          name: nginx-page-blue-tb447ghtcc
        name: page
      - configMap:
          name: nginx-conf-blue-t7987d6f75
        name: conf
