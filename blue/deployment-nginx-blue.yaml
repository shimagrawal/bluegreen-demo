apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    color: blue
  name: nginx-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
      color: blue
  template:
    metadata:
      labels:
        app: nginx
        color: blue
    spec:
      containers:
      - image: public.ecr.aws/nginx/nginx:1.31.4
        name: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html/index.html
          name: page
          subPath: index.html
      volumes:
      - configMap:
          name: nginx-page-blue-95b57fhcgf
        name: page
