apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -blue
labels:
  - pairs:
      color: blue
    includeSelectors: true
configMapGenerator:
  - name: nginx-page
    files:
      - index.html
images:
  - name: public.ecr.aws/nginx/nginx
    newTag: 1.27.0
